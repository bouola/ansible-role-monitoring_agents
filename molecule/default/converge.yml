---
- name: "Converge"
  hosts: all
  become: true
  vars:
    monitoring_agents_node_exporter_enabled: true
    monitoring_agents_promtail_enabled: true
    monitoring_agents_promtail_loki_url: "http://127.0.0.1:3100"
    monitoring_agents_promtail_log_paths:
      - path: "/tmp/molecule-promtail-default.log"
    monitoring_agents_acl_paths:
      - path: "/tmp/molecule-shared-acl"
        permissions: "rx"
        recursive: false
        default_acl: false
    monitoring_agents_cadvisor_enabled: true

  pre_tasks:
    - name: "Collect shared ACL fixture directory state"
      ansible.builtin.stat:
        path: "/tmp/molecule-shared-acl"
      register: monitoring_agents_shared_acl_fixture

    - name: "Create shared ACL fixture directory"
      ansible.builtin.file:
        path: "/tmp/molecule-shared-acl"
        state: directory
        owner: "root"
        group: "root"
        mode: "0700"
      when: not monitoring_agents_shared_acl_fixture.stat.exists

    - name: "Create default promtail log file"
      ansible.builtin.copy:
        dest: "/tmp/molecule-promtail-default.log"
        content: "default molecule log line\n"
        owner: "root"
        group: "root"
        mode: "0644"

  roles:
    - role: "bouola.monitoring_agents"
