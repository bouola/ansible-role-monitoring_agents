---
- name: "Verify"
  hosts: all
  become: true
  vars_files:
    - >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY')
      | default(lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY')
      | dirname | dirname, true) }}/defaults/main.yml
  vars:
    monitoring_agents_promtail_bearer_token_file: "/etc/monitoring-agents/loki.token"
  tasks:
    - name: "Collect Docker group membership"
      ansible.builtin.getent:
        database: group
        key: "docker"

    - name: "Assert monitoring user belongs to Docker group"
      ansible.builtin.assert:
        that:
          - monitoring_agents_user in ansible_facts.getent_group.docker[2].split(',')
        fail_msg: >-
          Monitoring user {{ monitoring_agents_user }} is not a member of the Docker group.

    - name: "Collect systemd journal group membership"
      ansible.builtin.getent:
        database: "group"
        key: "systemd-journal"

    - name: "Assert monitoring user belongs to systemd journal group"
      ansible.builtin.assert:
        that:
          - monitoring_agents_user in ansible_facts.getent_group["systemd-journal"][2].split(',')
        fail_msg: >-
          Monitoring user {{ monitoring_agents_user }} is not a member of the systemd-journal group.

    - name: "Read restricted log as monitoring user"
      ansible.builtin.command:
        cmd: "cat /tmp/molecule-promtail-readable/application.log"
      become: true
      become_user: "{{ monitoring_agents_user }}"
      changed_when: false
      register: monitoring_agents_restricted_log

    - name: "Assert monitoring user can read restricted log"
      ansible.builtin.assert:
        that:
          - monitoring_agents_restricted_log.stdout == "restricted log line"
        fail_msg: >-
          Monitoring user {{ monitoring_agents_user }} cannot read the restricted log.

    - name: "Collect default ACL for promtail readable directory"
      ansible.posix.acl:
        path: "/tmp/molecule-promtail-readable"
        state: "query"
      register: monitoring_agents_readable_directory_acl

    - name: "Assert promtail default group ACL exists"
      ansible.builtin.assert:
        that:
          - "'default:group:' ~ monitoring_agents_group ~ ':r-x' in monitoring_agents_readable_directory_acl.acl"
        fail_msg: >-
          Promtail readable directory does not grant the monitoring group a default read ACL.

    - name: "Collect promtail binary state"
      ansible.builtin.stat:
        path: "{{ monitoring_agents_binary_install_dir }}/promtail"
      register: monitoring_agents_promtail_binary

    - name: "Assert promtail binary exists"
      ansible.builtin.assert:
        that:
          - monitoring_agents_promtail_binary.stat.exists
          - monitoring_agents_promtail_binary.stat.executable
        fail_msg: >-
          promtail binary is missing or is not executable at
          {{ monitoring_agents_binary_install_dir }}/promtail.

    - name: "Collect promtail service state"
      ansible.builtin.systemd:
        name: "promtail"
      register: monitoring_agents_promtail_service
      failed_when: false

    - name: "Assert promtail service is enabled and running"
      ansible.builtin.assert:
        that:
          - not monitoring_agents_promtail_service.failed
          - monitoring_agents_promtail_service.status.ActiveState == "active"
          - monitoring_agents_promtail_service.status.UnitFileState == "enabled"
        fail_msg: >-
          promtail service is not enabled and active.

    - name: "Read promtail configuration"
      ansible.builtin.slurp:
        path: "{{ monitoring_agents_config_dir }}/promtail.yml"
      register: monitoring_agents_promtail_config

    - name: "Parse promtail configuration"
      ansible.builtin.set_fact:
        monitoring_agents_promtail_config_text: >-
          {{ monitoring_agents_promtail_config.content | b64decode }}
        monitoring_agents_promtail_config_data: >-
          {{ monitoring_agents_promtail_config.content | b64decode | from_yaml }}

    - name: "Assert promtail file scrape labels"
      ansible.builtin.assert:
        that:
          - monitoring_agents_promtail_config_data.scrape_configs[0].job_name == "file-tmp-molecule-promtail-agent-log"
          - monitoring_agents_promtail_config_data.scrape_configs[0].static_configs[0].labels.job == "file-tmp-molecule-promtail-agent-log"
          - monitoring_agents_promtail_config_data.scrape_configs[0].static_configs[0].labels.host == ansible_facts["hostname"]
          - monitoring_agents_promtail_config_data.scrape_configs[0].static_configs[0].labels.environment == "test"
          - monitoring_agents_promtail_config_data.scrape_configs[0].static_configs[0].labels.team == "observability"
          - monitoring_agents_promtail_config_data.scrape_configs[0].static_configs[0].labels.application == "promtail-agent"
          - monitoring_agents_promtail_config_data.scrape_configs[0].static_configs[0].labels.__path__ == "/tmp/molecule-promtail-agent.log"
        fail_msg: >-
          Promtail file scrape labels do not match the configured defaults and path labels.

    - name: "Wait for promtail port"
      ansible.builtin.wait_for:
        port: "{{ monitoring_agents_promtail_port }}"
        host: "127.0.0.1"
        timeout: 15
