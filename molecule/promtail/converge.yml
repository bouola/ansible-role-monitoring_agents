---
- name: "Converge"
  hosts: all
  become: true
  vars:
    monitoring_agents_node_exporter_enabled: false
    monitoring_agents_promtail_enabled: true
    monitoring_agents_promtail_docker_enabled: true
    monitoring_agents_promtail_readable_paths:
      - path: "/tmp/molecule-promtail-readable"
        recursive: true
        default_acl: true
    monitoring_agents_promtail_loki_url: "http://127.0.0.1:3100"
    monitoring_agents_promtail_bearer_token_file: "/etc/monitoring-agents/loki.token"
    monitoring_agents_promtail_default_labels:
      environment: "test"
      team: "platform"
    monitoring_agents_promtail_log_paths:
      - path: "/tmp/molecule-promtail-agent.log"
        labels:
          application: "promtail-agent"
          team: "observability"
    monitoring_agents_promtail_extra_scrape_configs:
      - job_name: "extra-file"
        static_configs:
          - targets:
              - "localhost"
            labels:
              job: "extra-file"
              __path__: "/tmp/molecule-promtail-extra.log"
    monitoring_agents_cadvisor_enabled: false
  pre_tasks:
    - name: "Collect restricted promtail readable directory state"
      ansible.builtin.stat:
        path: "/tmp/molecule-promtail-readable"
      register: monitoring_agents_restricted_directory

    - name: "Ensure Docker group exists for fixture"
      ansible.builtin.group:
        name: "docker"
        state: present

    - name: "Ensure monitoring group for token fixture"
      ansible.builtin.group:
        name: "{{ monitoring_agents_group }}"
        system: true
        state: present

    - name: "Create monitoring configuration directory for token fixture"
      ansible.builtin.file:
        path: "{{ monitoring_agents_config_dir }}"
        state: directory
        owner: "root"
        group: "{{ monitoring_agents_group }}"
        mode: "0750"

    - name: "Create promtail bearer token fixture"
      ansible.builtin.copy:
        dest: "{{ monitoring_agents_promtail_bearer_token_file }}"
        content: "molecule-token\n"
        owner: "root"
        group: "{{ monitoring_agents_group }}"
        mode: "0640"

    - name: "Create promtail log fixtures"
      ansible.builtin.copy:
        dest: "{{ monitoring_agents_log_fixture.path }}"
        content: "{{ monitoring_agents_log_fixture.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - path: "/tmp/molecule-promtail-agent.log"
          content: "agent log line\n"
        - path: "/tmp/molecule-promtail-extra.log"
          content: "extra log line\n"
      loop_control:
        loop_var: monitoring_agents_log_fixture
        label: "{{ monitoring_agents_log_fixture.path }}"

    - name: "Create restricted promtail readable directory"
      ansible.builtin.file:
        path: "/tmp/molecule-promtail-readable"
        state: directory
        owner: "root"
        group: "root"
        mode: "0700"
      when: not monitoring_agents_restricted_directory.stat.exists

    - name: "Collect restricted promtail readable file state"
      ansible.builtin.stat:
        path: "/tmp/molecule-promtail-readable/application.log"
      register: monitoring_agents_restricted_file

    - name: "Create restricted promtail readable file"
      ansible.builtin.copy:
        dest: "/tmp/molecule-promtail-readable/application.log"
        content: "restricted log line\n"
        owner: "root"
        group: "root"
        mode: "0600"
      when: not monitoring_agents_restricted_file.stat.exists
  roles:
    - role: "bouola.monitoring_agents"
