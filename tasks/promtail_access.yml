---
- name: "Collect Docker group state for promtail"
  ansible.builtin.getent:
    database: "group"
    key: "docker"
  register: monitoring_agents_docker_group
  failed_when: false
  when: monitoring_agents_promtail_docker_enabled

- name: "Fail when Docker group is absent for promtail"
  ansible.builtin.assert:
    that:
      - not monitoring_agents_docker_group.failed
      - ansible_facts.getent_group.docker is defined
    fail_msg: >-
      monitoring_agents_promtail_docker_enabled requires the docker group to exist.
      Install and configure Docker before enabling Promtail Docker log access.
  when: monitoring_agents_promtail_docker_enabled

- name: "Add monitoring agent user to Docker group for promtail"
  ansible.builtin.user:
    name: "{{ monitoring_agents_user }}"
    groups: "docker"
    append: true
  when: monitoring_agents_promtail_docker_enabled

- name: "Collect systemd-journal group state for promtail"
  ansible.builtin.getent:
    database: "group"
    key: "systemd-journal"
  register: monitoring_agents_systemd_journal_group
  failed_when: false
  when: monitoring_agents_promtail_systemd_journal_access_enabled

- name: "Fail when systemd-journal group is absent for promtail"
  ansible.builtin.assert:
    that:
      - not monitoring_agents_systemd_journal_group.failed
      - ansible_facts.getent_group["systemd-journal"] is defined
    fail_msg: >-
      monitoring_agents_promtail_systemd_journal_access_enabled requires the
      systemd-journal group to exist. Enable systemd journal access only on hosts
      that provide this group.
  when: monitoring_agents_promtail_systemd_journal_access_enabled

- name: "Add monitoring agent user to systemd-journal group for promtail"
  ansible.builtin.user:
    name: "{{ monitoring_agents_user }}"
    groups: "systemd-journal"
    append: true
  when: monitoring_agents_promtail_systemd_journal_access_enabled
