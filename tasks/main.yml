---
# Validate supported platform and enabled agent variables.
- name: "Run validation tasks"
  ansible.builtin.include_tasks:
    file: validate.yml
    apply:
      tags:
        - role-monitoring-agents-validate
  tags:
    - role-monitoring-agents-validate

# Create the shared runtime identity before managing agent resources.
- name: "Run shared runtime tasks"
  ansible.builtin.include_tasks:
    file: runtime.yml
    apply:
      tags:
        - role-monitoring-agents-acl
        - role-monitoring-agents-node-exporter
        - role-monitoring-agents-promtail
        - role-monitoring-agents-cadvisor
  tags:
    - role-monitoring-agents-acl
    - role-monitoring-agents-node-exporter
    - role-monitoring-agents-promtail
    - role-monitoring-agents-cadvisor
  when: >-
    monitoring_agents_node_exporter_enabled or monitoring_agents_promtail_enabled
    or monitoring_agents_cadvisor_enabled

# Install ACL utilities and grant configured path access once.
- name: "Run shared ACL tasks"
  ansible.builtin.include_tasks:
    file: acl.yml
    apply:
      tags:
        - role-monitoring-agents-acl
        - role-monitoring-agents-node-exporter
        - role-monitoring-agents-promtail
        - role-monitoring-agents-cadvisor
  tags:
    - role-monitoring-agents-acl
    - role-monitoring-agents-node-exporter
    - role-monitoring-agents-promtail
    - role-monitoring-agents-cadvisor
  when: >-
    (monitoring_agents_node_exporter_enabled or monitoring_agents_promtail_enabled
    or monitoring_agents_cadvisor_enabled) and monitoring_agents_acl_paths | length > 0

# Install, configure, and start node-exporter.
- name: "Run node-exporter tasks"
  ansible.builtin.include_tasks:
    file: node_exporter.yml
    apply:
      tags:
        - role-monitoring-agents-node-exporter
  tags:
    - role-monitoring-agents-node-exporter

# Install, configure, and start promtail only when enabled.
- name: "Run promtail tasks"
  ansible.builtin.include_tasks:
    file: promtail.yml
    apply:
      tags:
        - role-monitoring-agents-promtail
  tags:
    - role-monitoring-agents-promtail
  when: monitoring_agents_promtail_enabled

# Install, configure, and start cAdvisor only when enabled.
- name: "Run cadvisor tasks"
  ansible.builtin.include_tasks:
    file: cadvisor.yml
    apply:
      tags:
        - role-monitoring-agents-cadvisor
  tags:
    - role-monitoring-agents-cadvisor
  when: monitoring_agents_cadvisor_enabled
